name: Sync official Nuvio upstream

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nuvio-upstream-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge official dev branch without upstream workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          git fetch upstream dev --tags

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "Fork already contains the latest official Android changes."
            exit 0
          fi

          # The Actions GITHUB_TOKEN cannot modify workflow files. Preserve the
          # fork's own workflows and merge the upstream application code only.
          git merge --no-commit --no-ff upstream/dev
          git restore --source=HEAD --staged --worktree -- .github/workflows/
          git commit -m "Merge official Nuvio dev while retaining fork workflows"
          git push origin HEAD:dev
