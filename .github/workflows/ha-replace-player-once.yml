name: Apply HA player replacement fix (one-time)
on:
  push:
    branches:
      - fix/ha-replace-playing-stream
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace active player destination on incoming stream intent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nuvio/tv/MainActivity.kt')
          s = p.read_text()
          old = '''                    val pendingLaunch by pendingLaunchIntent.collectAsState()
                    LaunchedEffect(navController, layoutChosen, pendingLaunch) {
                        val launchIntent = pendingLaunch ?: return@LaunchedEffect
                        if (!layoutChosen) return@LaunchedEffect
                        pendingLaunchIntent.value = null

                        val playerRoute = playerRouteFromIntent(launchIntent)
                        if (playerRoute != null) {
                            navController.navigate(playerRoute) {
                                launchSingleTop = true
                            }
                            return@LaunchedEffect
                        }
          '''
          new = '''                    val pendingLaunch by pendingLaunchIntent.collectAsState()
                    LaunchedEffect(navController, layoutChosen, pendingLaunch) {
                        val launchIntent = pendingLaunch ?: return@LaunchedEffect
                        if (!layoutChosen) return@LaunchedEffect
                        pendingLaunchIntent.value = null

                        val playerRoute = playerRouteFromIntent(launchIntent)
                        if (playerRoute != null) {
                            // A new HA source must replace an active player destination.
                            // SingleTop alone reuses the current PlayerScreen and can
                            // leave its previous ExoPlayer session paused instead of
                            // initializing playback for the newly received stream URL.
                            val replacingActivePlayer =
                                navController.currentDestination?.route == Screen.Player.route
                            navController.navigate(playerRoute) {
                                if (replacingActivePlayer) {
                                    popUpTo(Screen.Player.route) { inclusive = true }
                                }
                                launchSingleTop = true
                            }
                            return@LaunchedEffect
                        }
          '''
          if old not in s:
              if new in s:
                  print('Fix is already applied')
              else:
                  raise SystemExit('Expected pending-launch navigation block not found')
          else:
              assert s.count(old) == 1
              p.write_text(s.replace(old,new,1))
          print('Android external-player replacement branch verified')
          PY
          git diff --check
      - name: Commit source fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/nuvio/tv/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Replace active player on new Home Assistant stream launch'
            git push
          fi