name: Apply HA player replacement fix (one-time)
on:
  push:
    branches:
      - fix/ha-replace-playing-stream
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace active player destination on incoming stream intent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nuvio/tv/MainActivity.kt')
          s = p.read_text()
          anchor = 'val pendingLaunch by pendingLaunchIntent.collectAsState()'
          assert s.count(anchor) == 1
          before, after = s.split(anchor, 1)
          def block(lines):
              return '\n'.join(' ' * (24 + offset) + text for offset, text in lines)
          old = block([
              (0, 'if (playerRoute != null) {'),
              (4, 'navController.navigate(playerRoute) {'),
              (8, 'launchSingleTop = true'),
              (4, '}'),
              (4, 'return@LaunchedEffect'),
              (0, '}'),
          ])
          new = block([
              (0, 'if (playerRoute != null) {'),
              (4, '// A new external source replaces an active player session;'),
              (4, '// singleTop alone can reuse the old paused PlayerScreen.'),
              (4, 'val replacingActivePlayer ='),
              (8, 'navController.currentDestination?.route == Screen.Player.route'),
              (4, 'navController.navigate(playerRoute) {'),
              (8, 'if (replacingActivePlayer) {'),
              (12, 'popUpTo(Screen.Player.route) { inclusive = true }'),
              (8, '}'),
              (8, 'launchSingleTop = true'),
              (4, '}'),
              (4, 'return@LaunchedEffect'),
              (0, '}'),
          ])
          if old in after:
              assert after.count(old) == 1
              p.write_text(before + anchor + after.replace(old, new, 1))
              print('Replaced active player navigation for new intents')
          elif new in after:
              print('Fix is already present')
          else:
              raise SystemExit('Pending-intent player block does not match; no changes made')
          PY
          git diff --check
      - name: Commit source fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/nuvio/tv/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Replace active player on new Home Assistant stream launch'
            git push
          fi